<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pirate Vessel Badge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      text-align: center;
      padding: 24px 12px;
      background: #e8e2d5;
      color: #2b1d14;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .badge {
      max-width: 620px;
      margin: 0 auto;
      background: #fdfaf3;
      border: 3px solid #382417;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .hat-wrapper {
      width: 90px;
      height: 68px;
      margin: 0 auto 6px auto;
    }
    .hat-wrapper svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    h1 {
      color: #8b1e1e;
      margin: 0 0 4px 0;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    p.lead {
      color: #5c4331;
      font-size: 1rem;
      margin: 0 0 20px 0;
      font-style: italic;
    }
    .qr-grid {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .qr-card {
      flex: 1;
      min-width: 240px;
      max-width: 270px;
      background: #f5eedf;
      border: 2px solid #8c6f56;
      border-radius: 10px;
      padding: 16px 14px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .step-number {
      display: inline-block;
      background: #8b1e1e;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .qr-card h2 {
      font-size: 1.15rem;
      color: #2b1d14;
      margin: 0 0 10px 0;
      font-weight: 700;
    }
    .qr-container {
      background: #ffffff;
      border: 1px solid #c4b5a2;
      border-radius: 6px;
      padding: 6px;
      display: inline-block;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .qr-container img {
      display: block;
      width: 190px;
      height: 190px;
    }
    .qr-details {
      width: 100%;
      background: rgba(74, 53, 37, 0.08);
      border: 1px solid #c4b5a2;
      border-radius: 6px;
      padding: 10px 12px;
      box-sizing: border-box;
      font-size: 0.92rem;
      line-height: 1.6;
      text-align: center;
    }
    .qr-details .detail-row {
      margin: 2px 0;
    }
    .qr-details .lbl {
      color: #5c4331;
      font-weight: 500;
    }
    .qr-details .val {
      color: #2b1d14;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1rem;
      font-weight: 700;
    }
    .qr-details .url-val {
      font-size: 0.95rem;
      word-break: break-all;
    }
    .qr-details .subtext {
      color: #7a6352;
      font-size: 0.8rem;
      margin-top: 3px;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .badge { box-shadow: none; border-color: #000; max-width: 100%; page-break-inside: avoid; break-inside: avoid; }
      .qr-grid { flex-wrap: nowrap; gap: 16px; }
      .qr-card { max-width: 48%; page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="badge">
    <div class="hat-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6b18"/>
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="50%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#560000"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e35"/>
      <stop offset="70%" stop-color="#15171b"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
  </defs>

  <!-- Feather Antenna behind hat -->
  <path d="M 230 140 C 290 80 340 30 330 10 C 310 10 260 60 210 120 Z" fill="url(#featherGrad)" stroke="#400" stroke-width="2" />
  <path d="M 230 140 C 280 80 325 20 330 10" stroke="#ff8a80" stroke-width="2" fill="none" />
  <path d="M 250 115 L 275 100 M 270 90 L 300 80 M 290 65 L 318 55 M 310 40 L 328 30" stroke="#ffcdd2" stroke-width="1.5" />

  <!-- RTL-SDR Antenna metallic mast tucked into feather -->
  <line x1="220" y1="150" x2="335" y2="5" stroke="url(#antennaGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="335" cy="5" r="4" fill="#ffeb3b" stroke="#f57f17" stroke-width="1.5" />
  <path d="M 330 -5 A 15 15 0 0 1 345 10" stroke="#ffeb3b" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M 325 -12 A 25 25 0 0 1 352 15" stroke="#ffeb3b" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- Tricorn Pirate Hat Main Body -->
  <path d="M 50 180 C 120 120 280 120 350 180 C 300 240 100 240 50 180 Z" fill="#0d0e11" />
  <path d="M 120 180 C 130 110 270 110 280 180 Z" fill="url(#hatGrad)" />

  <!-- Upturned Front Brim -->
  <path d="M 40 190 C 100 150 160 140 200 175 C 240 140 300 150 360 190 C 320 230 80 230 40 190 Z" fill="url(#hatGrad)" stroke="#111" stroke-width="3" />

  <!-- Gold Lace Trim -->
  <path d="M 42 188 C 100 148 160 138 200 173 C 240 138 300 148 358 188" fill="none" stroke="url(#goldGlow)" stroke-width="5" stroke-linecap="round"/>

  <!-- Skull and Crossbones Emblem -->
  <g transform="translate(200, 195)">
    <line x1="-28" y1="-18" x2="28" y2="18" stroke="#f0ede6" stroke-width="6" stroke-linecap="round" />
    <line x1="28" y1="-18" x2="-28" y2="18" stroke="#f0ede6" stroke-width="6" stroke-linecap="round" />
    <circle cx="-28" cy="-18" r="4" fill="#f0ede6" />
    <circle cx="28" cy="18" r="4" fill="#f0ede6" />
    <circle cx="28" cy="-18" r="4" fill="#f0ede6" />
    <circle cx="-28" cy="18" r="4" fill="#f0ede6" />
    <ellipse cx="0" cy="-6" rx="18" ry="16" fill="#f0ede6" />
    <path d="M -9 6 L 9 6 L 7 14 L -7 14 Z" fill="#f0ede6" />
    <ellipse cx="-6" cy="-6" rx="4" ry="5" fill="#15171b" />
    <ellipse cx="6" cy="-6" rx="4" ry="5" fill="#15171b" />
    <ellipse cx="-6" cy="-6" rx="5" ry="6" fill="#000" />
    <line x1="-22" y1="-18" x2="10" y2="4" stroke="#000" stroke-width="2" />
    <path d="M 0 -2 L -2 2 L 2 2 Z" fill="#15171b" />
    <line x1="-4" y1="9" x2="-4" y2="13" stroke="#15171b" stroke-width="1.5" />
    <line x1="0" y1="9" x2="0" y2="13" stroke="#15171b" stroke-width="1.5" />
    <line x1="4" y1="9" x2="4" y2="13" stroke="#15171b" stroke-width="1.5" />
  </g>

  <!-- RTL-SDR Dongle Body -->
  <rect x="200" y="150" width="22" height="36" rx="4" fill="#0277bd" stroke="#01579b" stroke-width="1.5" transform="rotate(25 210 168)" />
  <text x="202" y="172" font-size="7" font-family="monospace" font-weight="bold" fill="#ffffff" transform="rotate(25 210 168)">SDR</text>
  <circle cx="218" cy="154" r="2.5" fill="#4caf50" opacity="0.9" />
</svg>
    </div>

  </div>
</body>
