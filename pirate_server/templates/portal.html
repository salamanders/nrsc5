<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pirate Vessel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hat-wrapper">
        <img src="/static/pirate_hat.svg" alt="Pirate Hat" class="hat-img">
      </div>
      
      <h1>PIRATE VESSEL RADIO</h1>
      <p style="margin-bottom: 14px; font-size: 0.9rem; color: #6b5344;">Over-the-air digital radio recordings captured live aboard the vessel.</p>

      <!-- Android Flow: Single 1-tap button to launch real Chrome -->
      <div id="androidFlow" style="display: none;">
        <a href="intent://192.168.4.1/chest#Intent;scheme=http;action=android.intent.action.VIEW;end" class="btn btn-gold" style="padding: 16px; font-size: 1.15rem;">OPEN IN CHROME</a>
      </div>

      <!-- iOS / Default Flow: Board the ship button to signal Apple Success and keep connection -->
      <div id="iosFlow">
        <a href="/board" class="btn btn-gold" style="padding: 16px; font-size: 1.15rem; margin-bottom: 12px;">BOARD THE SHIP</a>
        <p style="font-size: 0.82rem; color: #6b5344; margin-bottom: 0;">Tap above, then tap <strong>Done</strong> at top-right to stay aboard the vessel.</p>
      </div>
    </div>
  </div>

  <script>
    if (/Android/.test(navigator.userAgent)) {
      document.getElementById('androidFlow').style.display = 'block';
      document.getElementById('iosFlow').style.display = 'none';
    }
  </script>
</body>
</html>
