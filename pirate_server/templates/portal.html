<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pirate Vessel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="hat-wrapper">
        <img src="/static/pirate_hat.svg" alt="Pirate Hat" class="hat-img">
      </div>
      
      <h1>PIRATE VESSEL RADIO</h1>
      <p style="margin-bottom: 12px; font-size: 0.95rem; color: #5c4331; line-height: 1.5;">
        Ye are connected to the vessel's Wi-Fi network!
      </p>

      <div class="handoff-box">
        <div class="handoff-title">To claim a track, open Safari or Chrome and go to:</div>
        <div class="copy-row">
          <input type="text" id="copyUrl" class="copy-input" value="http://192.168.4.1" readonly>
          <button type="button" id="copyBtn" class="btn-copy" onclick="copyAddress()">Copy Link</button>
        </div>
      </div>

      <p style="font-size: 0.85rem; color: #6b5344; margin: 0; line-height: 1.4;">
        (Or scan <strong>Step 2</strong> on the captain's badge).<br>
        Preview sheets do not allow saving audio files. Opening in your native browser ensures your track downloads straight to your device.
      </p>
    </div>
  </div>

  <script>
    function copyAddress() {
      const url = document.getElementById('copyUrl').value;
      const btn = document.getElementById('copyBtn');

      function showSuccess() {
        btn.innerText = "Copied!";
        btn.classList.add("copied");
        setTimeout(function() {
          btn.innerText = "Copy Link";
          btn.classList.remove("copied");
        }, 2500);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(showSuccess, fallback);
      } else {
        fallback();
      }

      function fallback() {
        const input = document.getElementById('copyUrl');
        input.select();
        input.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
          showSuccess();
        } catch (e) {
          btn.innerText = "Select & Copy";
        }
      }
    }
  </script>
</body>
</html>
